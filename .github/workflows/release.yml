name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # The same toolchain and toolkit as the Build workflow and local builds.
  ARM_TOOLCHAIN_VERSION: 14.2.rel1
  STCMD_NO_TTY: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ "3.10" ]
        include:
          - os: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the build tools
      run: |
          sudo DEBIAN_FRONTEND=noninteractive apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y cmake build-essential

    - name: Cache the ARM GNU Toolchain
      id: arm-toolchain
      uses: actions/cache@v4
      with:
        path: ~/arm-gnu-toolchain
        key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64

    - name: Download the ARM GNU Toolchain
      if: steps.arm-toolchain.outputs.cache-hit != 'true'
      run: |
          mkdir -p ~/arm-gnu-toolchain
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz" \
            | tar -xJ -C ~/arm-gnu-toolchain --strip-components=1

    - name: Use the ARM GNU Toolchain
      run: |
          echo "$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"
          echo "PICO_TOOLCHAIN_PATH=$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_ENV"

    - name: Install AtariST Toolkit Docker image
      run: curl -sL https://github.com/sidecartridge/atarist-toolkit-docker/releases/download/v1.3.0/install_atarist_toolkit_docker.sh | bash

    - name: Date the build by its commit
      run: echo "RELEASE_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        pip install boto3
          
    - name: Resolve APP_UUID (falls back to the dev UUID when no secret is set)
      env:
        APP_UUID_SECRET: ${{ secrets.APP_UUID }}
      run: echo "APP_UUID=${APP_UUID_SECRET:-44444444-4444-4444-8444-444444444444}" >> "$GITHUB_ENV"

    - name: Run - Build PICO_W release version
      run: ./build.sh pico_w Release "$APP_UUID"

    - name: Get current date
      id: build
      run: echo "::set-output name=date::$(date -u +"%Y-%m-%d %H:%M:%S UTC")"

    - name: Get version from version.txt
      id: get_version
      run: echo "RELEASE_VERSION=$(cat version.txt)" >> $GITHUB_ENV

    - name: Read partial CHANGELOG.md content
      id: changelog
      run: |
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        awk '/^---$/ { exit } { print }' CHANGELOG.md >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Copy release artifacts
      run: |
        mkdir -p release
        cp dist/*.uf2 release/
        cp dist/*.json release/

    - name: Upload the binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: release/*
        tag: ${{ github.ref }}
        release_name: ${{ env.RELEASE_VERSION }}
        body: |
          **Release Notes:**
          - Build Date: ${{ steps.build.outputs.date }}
          - Version: ${{ env.RELEASE_VERSION }}

          ${{ env.CHANGELOG }}
        file_glob: true
        overwrite: true
        make_latest: true

    - name: Upload artifacts to S3
      # Skip S3 publishing for development builds (the dev UUID). A real
      # release sets the APP_UUID secret to the app's own UUID.
      if: env.APP_UUID != '44444444-4444-4444-8444-444444444444'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1  # or your bucket's region
      run: |
        python3 <<EOF
        import os
        import boto3

        s3 = boto3.client('s3')
        release_dir = 'release'
        bucket_name = 'atarist.sidecartridge.com'

        for filename in os.listdir(release_dir):
            local_path = os.path.join(release_dir, filename)
            s3_path = filename  # uploaded at root of the bucket
            print(f"Uploading {local_path} to s3://{bucket_name}/{s3_path}")
            s3.upload_file(local_path, bucket_name, s3_path)
        EOF

  